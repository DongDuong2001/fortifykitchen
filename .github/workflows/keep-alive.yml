name: Keep Alive Render API

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from sleeping (spins down after 15 mins of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend API
        run: |
          API_URL="${{ secrets.RENDER_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://fortifykitchen-api.onrender.com/api/health"
          fi
          echo "Pinging API at: $API_URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "API is awake and healthy!"
          else
            echo "Warning: API returned status $HTTP_STATUS"
          fi
